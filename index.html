<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عملیات بیدارسازی علی و داریوش</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --bg: #1a1a24;
      --pixel-border: 4px solid #fff;
      --text: #fff;
      --bar-bg: #444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'VT323', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .game-container {
      width: 90%;
      max-width: 600px;
      text-align: center;
      border: var(--pixel-border);
      padding: 20px;
      background-color: #2b2b36;
      box-shadow: 10px 10px 0px #000;
    }

    h1 {
      font-size: 32px;
      text-shadow: 3px 3px 0 #000;
      margin-top: 0;
    }

    .room {
      display: flex;
      justify-content: space-around;
      margin: 30px 0;
      padding: 20px;
      background-color: #111;
      border: 2px solid #555;
      position: relative;
    }

    .bed {
      font-size: 60px;
      position: relative;
      filter: drop-shadow(4px 4px 0px #000);
    }

    .character {
      position: absolute;
      top: -30px;
      left: 10px;
      font-size: 50px;
      transition: transform 0.1s;
    }

    .zzzs {
      position: absolute;
      top: -60px;
      right: -20px;
      font-size: 30px;
      color: #aaa;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 1; }
    }

    .meter-box {
      margin: 20px 0;
      border: 4px solid #fff;
      background-color: var(--bar-bg);
      height: 40px;
      position: relative;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f1c40f, #e74c3c);
      transition: width 0.1s;
    }

    .meter-text {
      position: absolute;
      top: 5px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      background-color: #e74c3c;
      color: #fff;
      border: 4px solid #fff;
      padding: 10px 15px;
      font-family: 'VT323', monospace;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      transition: 0.1s;
    }

    .btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 #000;
    }

    .btn-start {
      background-color: #2ecc71;
      font-size: 24px;
      padding: 15px 30px;
      margin-bottom: 20px;
    }

    #game-ui {
      display: none;
    }

    .mic-status {
      font-size: 18px;
      color: #e74c3c;
      animation: blink 1s infinite step-end;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .shake {
      animation: shaking 0.5s infinite;
    }

    @keyframes shaking {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
  </style>
</head>
<body>

  <div class="game-container" id="start-screen">
    <h1>عملیات بیدارسازی</h1>
    <p style="font-size: 24px;">علی و داریوش به خواب زمستانی رفته‌اند.</p>
    <p style="font-size: 20px; color: #aaa;">برای شروع، دسترسی میکروفون را بدهید و تا جایی که می‌توانید سرشان داد بزنید!</p>
    <button class="btn btn-start" onclick="initAudio()">روشن کردن میکروفون و شروع</button>
  </div>

  <div class="game-container" id="game-ui">
    <h1>علی و داریوش را بیدار کن!</h1>
    
    <div class="room" id="bedroom">
      <div class="bed">
        🛏️
        <div class="character" id="ali">👨🏻‍🦱</div>
        <div class="zzzs" id="zzz-ali">💤</div>
      </div>
      
      <div class="bed">
        🛏️
        <div class="character" id="dariush">🧑🏻</div>
        <div class="zzzs" id="zzz-dariush">💤</div>
      </div>
    </div>

    <div class="mic-status">🎙️ در حال گوش دادن (داد بزن!)...</div>

    <div class="meter-box">
      <div class="meter-fill" id="meter"></div>
      <div class="meter-text" id="meter-text">۰٪</div>
    </div>

    <div class="controls">
      <button class="btn" onclick="triggerAction(15, '🪣💦')">آب یخ (۱۵٪)</button>
      <button class="btn" onclick="triggerAction(25, '🎺🔊')">بوق شیپوری (۲۵٪)</button>
      <button class="btn" onclick="triggerAction(10, '💡')">روشن کردن لامپ (۱۰٪)</button>
    </div>
  </div>

<script>
  let audioContext;
  let analyser;
  let microphone;
  let wakeLevel = 0;
  let isAwake = false;
  let animationId;

  async function initAudio() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-ui').style.display = 'block';

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;

      microphone = audioContext.createMediaStreamSource(stream);
      microphone.connect(analyser);

      detectSound();
    } catch (err) {
      alert("بدون میکروفون که نمی‌شه داد زد! دسترسی رو چک کن.");
      console.error(err);
    }
  }

  function detectSound() {
    if (isAwake) return;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }
    
    let averageVolume = sum / dataArray.length;

    if (averageVolume > 40) {
      wakeLevel += (averageVolume - 40) * 0.08; 
      document.getElementById('bedroom').classList.add('shake');
    } else {
      wakeLevel -= 0.3; 
      document.getElementById('bedroom').classList.remove('shake');
    }

    if (wakeLevel < 0) wakeLevel = 0;
    if (wakeLevel >= 100) {
      wakeLevel = 100;
      winGame();
    }

    updateUI();
    animationId = requestAnimationFrame(detectSound);
  }

  function triggerAction(boost, emoji) {
    if (isAwake) return;
    wakeLevel += boost;
    
    const room = document.getElementById('bedroom');
    const floatingEmoji = document.createElement('div');
    floatingEmoji.innerText = emoji;
    floatingEmoji.style.position = 'absolute';
    floatingEmoji.style.fontSize = '50px';
    floatingEmoji.style.top = '10px';
    floatingEmoji.style.left = '45%';
    room.appendChild(floatingEmoji);

    setTimeout(() => floatingEmoji.remove(), 500);

    if (wakeLevel >= 100) winGame();
  }

  function updateUI() {
    document.getElementById('meter').style.width = wakeLevel + '%';
    document.getElementById('meter-text').innerText = Math.floor(wakeLevel) + '٪';

    if (wakeLevel > 60) {
      document.getElementById('zzz-ali').style.opacity = '0';
      document.getElementById('zzz-dariush').style.opacity = '0';
    } else {
      document.getElementById('zzz-ali').style.opacity = '1';
      document.getElementById('zzz-dariush').style.opacity = '1';
    }
  }

  function winGame() {
    isAwake = true;
    cancelAnimationFrame(animationId);
    document.getElementById('meter').style.width = '100%';
    
    document.getElementById('ali').innerText = '🤬';
    document.getElementById('dariush').innerText = '😡';
    document.getElementById('zzz-ali').style.display = 'none';
    document.getElementById('zzz-dariush').style.display = 'none';
    document.getElementById('bedroom').classList.remove('shake');

    setTimeout(() => {
      alert("موفق شدی! بیدار شدن ولی خیلی شاکی‌ان 😂");
      location.reload();
    }, 500);
  }
</script>

</body>
</html>
